# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Stellamorph # the website title (if blank, full name will be used instead)
first_name:
middle_name:
last_name:
email:
description: >

footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
keywords:

lang: en
icon:

url: ''
baseurl: ''
last_updated: false

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

highlight_theme_light: github
highlight_theme_dark: native

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true

max_width: 1000px

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

plugins_dir: _plugins_disabled

include: ['_pages']
exclude:
  - Gemfile
  - Gemfile.lock
  - "*.log"
  - vendor
  - _plugins
keep_files:
  - CNAME
  - .nojekyll
  - .git

plugins:
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-target-blank

# Sitemap settings
defaults:
  - scope:
      path: "assets/**/*.*"
    values:
      sitemap: false

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:

  last_name:
  first_name:

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

filtered_bibtex_keywords: [abbr, abstract, arxiv, bibtex_show, html, pdf, selected, supp, blog, code, poster, slides, website, preview]
max_author_limit: 3
more_authors_animation_delay: 10

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_math:                true
enable_darkmode:            false
enable_medium_zoom:         true

# -----------------------------------------------------------------------------
# RSS Feed
# -----------------------------------------------------------------------------

rss_icon: true

