  {%- if site.enable_math -%}
  <!-- MathJax -->
  <script type="text/javascript">
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams'
      },
      options: {
        enableMenu: false
      }
    };
  </script>
  <script defer type="text/javascript" id="MathJax-script" src="{{ '/assets/js/mathjax/es5/tex-mml-chtml.js' | relative_url }}"></script>
  {%- endif %}
